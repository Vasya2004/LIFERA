name: Lifera2
options:
  bundleIdPrefix: app.lifera
  deploymentTarget:
    iOS: "17.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  Lifera2:
    type: application
    platform: iOS
    sources:
      - path: Lifera2/Sources
      - path: Lifera2/Resources/Assets.xcassets
    info:
      path: Lifera2/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: LIFERA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lifera.lifera2
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Supabase
        product: Supabase
